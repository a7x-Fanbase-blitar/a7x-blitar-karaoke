<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A7X Fanbase Karaoke - Live Station</title>
    <!-- Font Metal / Gothic dari Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Orbitron:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.344.0/dist/umd/lucide.min.js"></script>
    
    <style>
        :root {
            --bg-color: #050505;
            --panel-bg: rgba(15, 15, 15, 0.75);
            --panel-border: rgba(255, 0, 0, 0.2);
            --accent-red: #ff0000;
            --accent-glow: #ff2222;
            --text-main: #f5f5f5;
            --text-muted: #8a8a8a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

       body {
            background-color: var(--bg-color);
            position: relative;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;

            /* GANTI DI SINI: Masukkan link gambar latar belakangmu */
            background-image: 
                linear-gradient(rgba(5, 5, 5, 0.85), rgba(5, 5, 5, 0.85)), 
                url('https://tse3.mm.bing.net/th/id/OIP.NuRa_CLjKeYZHy70nRJK0gHaEK?cb=thfc1falcon2&rs=1&pid=ImgDetMain&o=7&rm=3');
            
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Animasi Background Partikel Bergerak */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 0, 0, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255, 0, 0, 0.05) 0%, transparent 45%);
            z-index: -1;
            animation: pulseBg 8s ease-in-out infinite alternate;
        }

        @keyframes pulseBg {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        /* Header Style & Animasi Tulisan Bergerak */
        header {
            text-align: center;
            padding: 30px 20px 10px;
        }

        header h1 {
            font-family: 'Cinzel Decorative', serif;
            font-size: 2.2rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 3px;
            animation: neonGlow 2.5s ease-in-out infinite alternate;
        }

        header p {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            color: var(--text-main);
            letter-spacing: 4px;
            margin-top: 8px;
            text-transform: uppercase;
            opacity: 0.8;
            text-shadow: 0 0 5px rgba(255, 0, 0, 0.5);
        }

        /* Animasi Gelombang Cahaya Tulisan */
        @keyframes neonGlow {
            0% {
                text-shadow: 0 0 10px rgba(255, 0, 0, 0.5), 0 0 20px rgba(255, 0, 0, 0.3);
            }
            100% {
                text-shadow: 0 0 20px var(--accent-glow), 0 0 40px var(--accent-glow), 0 0 10px rgba(255,255,255,0.5);
                transform: scale(1.01);
            }
        }

        /* Layout Utama */
        .container {
            max-width: 1250px;
            width: 100%;
            margin: 0 auto;
            padding: 15px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            flex: 1;
        }

        /* Kiri: Player & Controls */
        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .video-box {
            background: #000;
            border: 2px solid var(--panel-border);
            border-radius: 12px;
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
        }

        .video-box iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: none;
        }

        /* Live Controller Button */
        .control-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 15px;
            border-radius: 30px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            flex-wrap: wrap;
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .btn-action:hover {
            background: rgba(255, 0, 0, 0.2);
            border-color: var(--accent-red);
            color: #fff;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .btn-join {
            background: linear-gradient(135deg, #cc0000 0%, #7a0000 100%);
            border: none;
            color: #fff;
            padding: 0 25px;
            height: 42px;
            border-radius: 21px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .btn-join:hover {
            transform: scale(1.03);
            box-shadow: 0 0 25px var(--accent-glow);
            background: linear-gradient(135deg, #ff0000 0%, #990000 100%);
        }

        /* Queue / Playlist Box */
        .queue-box {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        .queue-box h3 {
            font-family: 'Orbitron', sans-serif;
            color: #fff;
            font-size: 1rem;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255,0,0,0.2);
            padding-bottom: 8px;
        }

        .song-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 220px;
            overflow-y: auto;
        }

        .song-item {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 12px 15px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
        }

        .song-item:hover, .song-item.active {
            border-color: var(--accent-red);
            background: rgba(255, 0, 0, 0.1);
        }

        .song-item.active {
            font-weight: bold;
            box-shadow: inset 0 0 10px rgba(255, 0, 0, 0.2);
        }

        /* Kanan: Shoutbox */
        .right-panel {
            display: flex;
            flex-direction: column;
        }

        .shoutbox {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 0, 0, 0.25);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 480px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 0 20px rgba(255,0,0,0.05);
        }

        .shoutbox-header {
            font-family: 'Orbitron', sans-serif;
            color: #ff3333;
            font-size: 0.95rem;
            letter-spacing: 2px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .chat-msg {
            font-size: 0.9rem;
            line-height: 1.4;
            word-break: break-word;
        }

        .chat-msg .admin {
            color: #ff3333;
            font-weight: bold;
        }

        .chat-msg .user {
            color: #dddddd;
            font-weight: bold;
        }

        .chat-input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-field {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 10px 15px;
            color: #fff;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--accent-red);
            box-shadow: 0 0 8px rgba(255,0,0,0.3);
        }

        .btn-send {
            background: #cc0000;
            border: none;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: background 0.2s;
        }

        .btn-send:hover {
            background: #ff0000;
        }

        /* POP-UP MODAL UI */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.4s ease;
        }

        .modal-box {
            background: rgba(15, 15, 15, 0.95);
            border: 2px solid var(--accent-red);
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.4);
            border-radius: 15px;
            padding: 35px;
            max-width: 420px;
            width: 90%;
            text-align: center;
        }

        .modal-box h2 {
            font-family: 'Cinzel Decorative', serif;
            color: #fff;
            font-size: 1.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .modal-box p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .role-btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 10px;
        }

        .btn-role {
            flex: 1;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.03);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-role:hover {
            background: rgba(255, 0, 0, 0.15);
            border-color: var(--accent-red);
            box-shadow: 0 0 15px rgba(255,0,0,0.3);
        }

        .admin-auth-area {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 15px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            border-top: 1px solid rgba(255,255,255,0.05);
            margin-top: 20px;
            font-family: 'Orbitron', sans-serif;
        }

        /* RESPONSIVE CSS DESIGN UNTUK HP (MOBILE FIRST CONFIG) */
        @media (max-width: 850px) {
            .container {
                grid-template-columns: 1fr;
                padding: 10px;
                gap: 15px;
            }
            header h1 { font-size: 1.6rem; }
            header p { font-size: 0.75rem; letter-spacing: 2px; }
            .shoutbox { min-height: 380px; }
            .control-bar { padding: 10px; gap: 8px; border-radius: 20px; }
            .btn-action { width: 38px; height: 38px; }
            .btn-join { padding: 0 15px; height: 38px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>

    <!-- POPUP MODAL PILIH PERAN -->
    <div class="modal-overlay" id="role-modal">
        <div class="modal-box">
            <h2>Pilih Peran Sesi</h2>
            <p>Silakan tentukan identitas masukmu untuk panggung virtual Deathbat Blitar Raya malam ini.</p>
            
            <div class="role-btn-group">
                <button class="btn-role" onclick="pilihAkses('member')">🤘 MEMBER</button>
                <button class="btn-role" onclick="tampilkanAuthAdmin()">💀 ADMIN / HOST</button>
            </div>

            <div class="admin-auth-area" id="auth-panel">
                <input type="password" id="admin-pass" class="input-field" placeholder="Masukkan Password Admin...">
                <button class="btn-send" style="padding: 12px;" onclick="validasiAdmin()">Verifikasi Masuk</button>
            </div>
        </div>
    </div>

    <header>
        <h1>Avenged Sevenfold Fan Karaoke</h1>
        <p>Live Virtual Session</p>
    </header>

    <div class="container">
        <!-- SEKTOR KIRI: PLAYER & LIST -->
        <div class="left-panel">
            <div class="video-box">
                <!-- YouTube Iframe API Container -->
                <div id="yt-player-placeholder"></div>
            </div>

            <!-- Kontrol Sesi Live -->
            <div class="control-bar">
                <button class="btn-action" title="Lagu Sebelumnya" onclick="kontrolVideo('prev')"><i data-lucide="skip-back"></i></button>
                <button class="btn-action" id="play-pause-btn" title="Play" onclick="kontrolVideo('toggle')"><i data-lucide="play"></i></button>
                <button class="btn-action" title="Stop" onclick="kontrolVideo('stop')"><i data-lucide="square"></i></button>
                
                <button class="btn-join" onclick="joinSession()">Join The Live Session!</button>
                
                <button class="btn-action" id="loop-btn" title="Ulangi Lagu Ini (Mati)" onclick="kontrolVideo('loop')"><i data-lucide="repeat"></i></button>
                <button class="btn-action" id="shuffle-btn" title="Mode Acak (Mati)" onclick="kontrolVideo('shuffle')"><i data-lucide="shuffle"></i></button>
                <button class="btn-action" title="Lagu Berikutnya" onclick="kontrolVideo('next')"><i data-lucide="skip-forward"></i></button>
            </div>

            <!-- Daftar Antrean Lagu -->
            <div class="queue-box">
                <h3>Live Queue / Playlist</h3>
                <ul class="song-list" id="playlist-container">
                    <!-- Ditangani via JS -->
                </ul>
            </div>
        </div>

        <!-- SEKTOR KANAN: MOSHPIT SHOUTBOX -->
        <div class="right-panel">
            <div class="shoutbox">
                <div class="shoutbox-header">
                    <i data-lucide="message-square" style="width: 18px; color: #ff3333;"></i> Moshpit Shoutbox
                </div>
                
                <div class="chat-area" id="chat-box">
                    <!-- Chat flow -->
                </div>

                <div class="chat-input-group">
                    <input type="text" id="chat-name" class="input-field" placeholder="Nama / Nickname...">
                    <input type="text" id="chat-text" class="input-field" placeholder="Ketik pesan moshpit...">
                    <button class="btn-send" onclick="kirimPesan()">Kirim</button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        © 2026 OFFICIAL A7X FANBASE INDO - DEVELOPED BY THE FALLEN_BLITAR
    </footer>

<!-- JavaScript SDK & Libraries -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<script>
    // 1. FIREBASE CONFIG
    const firebaseConfig = {
        apiKey: "AIzaSyBFlwXqdXmBFv3phfrzJJVua_1mmbqdMLI",
        authDomain: "a7x-karaoke.firebaseapp.com",
        databaseURL: "https://a7x-karaoke-default-rtdb.firebaseio.com", 
        projectId: "a7x-karaoke",
        storageBucket: "a7x-karaoke.firebasestorage.app",
        messagingSenderId: "597923188585",
        appId: "1:597923188585:web:f1d99cb92ebd67b127b7f8",
        measurementId: "G-R7KWEQF3ZK"
    };
    
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const roomRef = database.ref("live_room");
    const chatRef = database.ref("moshpit_chat");
    const peersRef = database.ref("online_peers");

    const a7xPlaylist = [
        { id: "L1utJu343s0", title: "1. Dear God - Avenged Sevenfold" },
        { id: "bC9ASPO051M", title: "2. Seize The Day - Avenged Sevenfold" }
    ];

    let currentSongIndex = 0;
    let isHost = false; 
    let ytPlayer;
    let isLooping = false;
    let isShuffled = false;
    let myPeer, localStream;

    // Load YouTube Iframe Player API
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    function onYouTubeIframeAPIReady() {
        ytPlayer = new YT.Player('yt-player-placeholder', {
            height: '100%',
            width: '100%',
            videoId: a7xPlaylist[0].id,
            playerVars: {
                'autoplay': 0,
                'controls': 1,
                'enablejsapi': 1,
                'rel': 0,
                'iv_load_policy': 3
            },
            events: {
                'onReady': onPlayerReady,
                'onStateChange': onPlayerStateChange
            }
        });
    }

    // 2. MODAL VALIDASI PERAN
    function tampilkanAuthAdmin() {
        document.getElementById('auth-panel').style.display = 'flex';
        document.getElementById('admin-pass').focus();
    }

    function validasiAdmin() {
        const pass = document.getElementById('admin-pass').value;
        if (pass === 'a7x2026') {
            isHost = true;
            document.getElementById('chat-name').value = "Admin";
            document.getElementById('chat-name').disabled = true;
            pilihAkses('admin');
        } else {
            alert("Sandi Admin Salah!");
        }
    }

    function pilihAkses(peran) {
        document.getElementById('role-modal').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('role-modal').style.display = 'none';
        }, 400);
        
        lucide.createIcons();
        loadPlaylist();
        initFirebaseListeners();
    }

    document.getElementById('admin-pass').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') validasiAdmin();
    });

    // 3. RENDER PLAYLIST PANEL
    function loadPlaylist() {
        const playlistContainer = document.getElementById('playlist-container');
        playlistContainer.innerHTML = '';
        a7xPlaylist.forEach((song, idx) => {
            const li = document.createElement('li');
            li.className = `song-item ${idx === currentSongIndex ? 'active' : ''}`;
            li.innerHTML = `<i data-lucide="music-2" style="width:16px; color: #ff3333;"></i> <span>${song.title}</span>`;
            
            li.onclick = () => {
                if (!isHost) {
                    alert("Kunci Otoritas! Hanya Admin yang berhak memindahkan lagu.");
                    return;
                }
                currentSongIndex = idx;
                perbaruiKondisiRoom(a7xPlaylist[idx].id, 'play');
            };
            playlistContainer.appendChild(li);
        });
        lucide.createIcons();
    }

    // 4. MANAGEMENT PERINTAH SINKRONISASI VIDEO (FIREBASE NOCookie ANTI-IKLAN)
    function perbaruiKondisiRoom(songId, statusAksi) {
        if (!isHost) return;
        roomRef.set({
            currentSongId: songId,
            action: statusAksi,
            timestamp: Date.now()
        });
    }

    function initFirebaseListeners() {
        // Mendengarkan Perubahan Sinkronisasi Antar Device (Menggunakan Domain NoCookie)
        roomRef.on("value", (snapshot) => {
            const data = snapshot.val();
            if (data && ytPlayer) {
                const targetIdx = a7xPlaylist.findIndex(s => s.id === data.currentSongId);
                if (targetIdx !== -1) currentSongIndex = targetIdx;

                // Memaksa penggantian URL Iframe langsung tembak youtube-nocookie
                const srcSekarang = document.getElementById('yt-player-placeholder').src || "";
                if (!srcSekarang.includes(data.currentSongId)) {
                    document.getElementById('yt-player-placeholder').src = `https://www.youtube-nocookie.com/embed/${data.currentSongId}?autoplay=1&enablejsapi=1&rel=0&iv_load_policy=3`;
                }

                // Handler status tombol aksi
                setTimeout(() => {
                    try {
                        if (data.action === 'play') {
                            if (typeof ytPlayer.playVideo === 'function') ytPlayer.playVideo();
                        } else if (data.action === 'pause') {
                            if (typeof ytPlayer.pauseVideo === 'function') ytPlayer.pauseVideo();
                        } else if (data.action === 'stop') {
                            if (typeof ytPlayer.stopVideo === 'function') ytPlayer.stopVideo();
                        }
                    } catch(err) { console.log("Player bising ditahan browser:", err); }
                }, 800);

                // Update visual list active
                document.querySelectorAll('.song-item').forEach((item, idx) => {
                    if (idx === currentSongIndex) {
                        item.classList.add('active');
                    } else {
                        item.classList.remove('active');
                    }
                });
            }
        });

        // Chat Listener
        chatRef.limitToLast(30).on("child_added", (snapshot) => {
            const chatBox = document.getElementById('chat-box');
            const data = snapshot.val();
            const msgDiv = document.createElement('div');
            msgDiv.className = 'chat-msg';
            const roleClass = data.name.toLowerCase() === 'admin' ? 'admin' : 'user';
            
            msgDiv.innerHTML = `<span class="${roleClass}">${data.name}:</span> ${data.text}`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    }

    function onPlayerReady(event) {
        console.log("Player Siap.");
    }

    function onPlayerStateChange(event) {
        const playPauseBtn = document.getElementById('play-pause-btn');
        if (event.data == YT.PlayerState.PLAYING) {
            playPauseBtn.innerHTML = `<i data-lucide="pause"></i>`;
        } else {
            playPauseBtn.innerHTML = `<i data-lucide="play"></i>`;
        }
        lucide.createIcons();

        if (event.data == YT.PlayerState.ENDED && isHost) {
            if (isLooping) {
                perbaruiKondisiRoom(a7xPlaylist[currentSongIndex].id, 'play');
            } else {
                kontrolVideo('next');
            }
        }
    }

    // 5. IMPLEMENTASI TOMBOL-TOMBOL KONTROL
    function kontrolVideo(aksi) {
        if (!isHost) {
            alert("Akses Terkunci! Hanya Admin yang memegang kendali tombol.");
            return;
        }

        if (aksi === 'toggle') {
            const state = ytPlayer.getPlayerState();
            if (state == YT.PlayerState.PLAYING) {
                perbaruiKondisiRoom(a7xPlaylist[currentSongIndex].id, 'pause');
            } else {
                perbaruiKondisiRoom(a7xPlaylist[currentSongIndex].id, 'play');
            }
        } else if (aksi === 'stop') {
            perbaruiKondisiRoom(a7xPlaylist[currentSongIndex].id, 'stop');
        } else if (aksi === 'next') {
            currentSongIndex = isShuffled ? Math.floor(Math.random() * a7xPlaylist.length) : (currentSongIndex + 1) % a7xPlaylist.length;
            perbaruiKondisiRoom(a7xPlaylist[currentSongIndex].id, 'play');
        } else if (aksi === 'prev') {
            currentSongIndex = (currentSongIndex - 1 + a7xPlaylist.length) % a7xPlaylist.length;
            perbaruiKondisiRoom(a7xPlaylist[currentSongIndex].id, 'play');
        } else if (aksi === 'loop') {
            isLooping = !isLooping;
            styleBtn('loop-btn', isLooping);
        } else if (aksi === 'shuffle') {
            isShuffled = !isShuffled;
            styleBtn('shuffle-btn', isShuffled);
        }
    }

    function styleBtn(id, active) {
        const btn = document.getElementById(id);
        btn.style.borderColor = active ? 'var(--accent-red)' : 'rgba(255,255,255,0.1)';
        btn.style.boxShadow = active ? '0 0 10px var(--accent-glow)' : 'none';
    }

    // 6. MOSHPIT SHOUTBOX
    function kirimPesan() {
        const nameInput = document.getElementById('chat-name');
        const textInput = document.getElementById('chat-text');

        if(nameInput.value.trim() !== "" && textInput.value.trim() !== "") {
            chatRef.push({
                name: nameInput.value,
                text: textInput.value,
                timestamp: Date.now()
            });
            textInput.value = "";
        }
    }

    document.getElementById('chat-text').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') kirimPesan();
    });

    // 7. SINKRONISASI LIVE VOICE PEERJS
    function joinSession() {
        const btnJoin = document.querySelector('.btn-join');
        btnJoin.innerText = "MENGHUBUNGKAN...";
        btnJoin.disabled = true;

        navigator.mediaDevices.getUserMedia({ audio: true, video: false })
        .then((stream) => {
            localStream = stream;
            myPeer = new Peer();

            myPeer.on('open', (userId) => {
                const myPeerRef = peersRef.push({ peerId: userId, timestamp: Date.now() });
                myPeerRef.onDisconnect().remove();

                btnJoin.innerText = "LIVE VOICE CONNECTED 🔴";
                btnJoin.style.background = "#00cc44";
                btnJoin.style.boxShadow = "0 0 15px #00cc44";
            });

            myPeer.on('call', (call) => {
                call.answer(localStream);
                call.on('stream', (remoteStream) => { playAudioStream(remoteStream); });
            });

            peersRef.on('child_added', (snapshot) => {
                const data = snapshot.val();
                if (data && data.peerId !== myPeer.id) {
                    const call = myPeer.call(data.peerId, localStream);
                    call.on('stream', (remoteStream) => { playAudioStream(remoteStream); });
                }
            });
        })
        .catch((err) => {
            alert("Gagal mengaktifkan voice chat. Mohon izinkan mikrofon: " + err);
            btnJoin.innerText = "JOIN THE LIVE SESSION!";
            btnJoin.disabled = false;
        });
    }

    function playAudioStream(stream) {
        const existingAudios = Array.from(document.querySelectorAll('audio'));
        const alreadyPlaying = existingAudios.some(audio => audio.srcObject && audio.srcObject.id === stream.id);
        if (!alreadyPlaying) {
            const audio = document.createElement('audio');
            audio.srcObject = stream;
            audio.autoplay = true;
            document.body.appendChild(audio);
        }
    }
</script>
</body>
