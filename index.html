<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A7X Fanbase Karaoke - Live Station</title>
    <!-- Font Metal / Gothic dari Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Orbitron:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.344.0/dist/umd/lucide.min.js"></script>
    
    <style>
        :root {
            --bg-color: #050505;
            --panel-bg: rgba(12, 12, 12, 0.82);
            --panel-border: rgba(255, 0, 0, 0.25);
            --accent-red: #ff0000;
            --accent-glow: #ff2222;
            --text-main: #f5f5f5;
            --text-muted: #8a8a8a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            position: relative;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;

            /* Lapisan kaca hitam transparan 85% di atas gambar background Deathbat */
            background-image: 
                linear-gradient(rgba(5, 5, 5, 0.85), rgba(5, 5, 5, 0.85)), 
                url('https://wallpaperaccess.com/full/1616251.jpg');
            
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* EFEK BARA API BERGERAK (AMBER FLAME LAYER) */
        body::before {
            content: "";
            position: fixed;
            bottom: -50px; left: -50px; right: -50px; top: -50px;
            /* Membuat ilusi lidah kobaran api vertikal abstrak */
            background: linear-gradient(0deg, rgba(230, 0, 0, 0.18) 0%, rgba(255, 68, 0, 0.06) 40%, transparent 80%);
            z-index: -1;
            mix-blend-mode: screen; /* Membuat pendaran apinya menyala menyatu di atas gambar */
            animation: burnFlames 5s ease-in-out infinite alternate, moveUp 12s linear infinite;
            opacity: 0.85;
        }

        /* Efek Denyut Membara */
        @keyframes burnFlames {
            0% { opacity: 0.6; transform: scale(1) skewX(-2deg); filter: blur(4px); }
            100% { opacity: 0.9; transform: scale(1.05) skewX(2deg); filter: blur(6px); }
        }

        /* Efek Aliran Bara Api Naik Ke Atas */
        @keyframes moveUp {
            0% { background-position-y: 0px; }
            100% { background-position-y: 800px; }
        }

        header {
            text-align: center;
            padding: 30px 20px 10px;
        }

        header h1 {
            font-family: 'Cinzel Decorative', serif;
            font-size: 2.2rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 3px;
            animation: neonGlow 2.5s ease-in-out infinite alternate;
        }

        header p {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            color: var(--text-main);
            letter-spacing: 4px;
            margin-top: 8px;
            text-transform: uppercase;
            opacity: 0.8;
            text-shadow: 0 0 5px rgba(255, 0, 0, 0.5);
        }

        @keyframes neonGlow {
            0% { text-shadow: 0 0 10px rgba(255, 0, 0, 0.5), 0 0 20px rgba(255, 0, 0, 0.3); }
            100% { text-shadow: 0 0 20px var(--accent-glow), 0 0 40px var(--accent-glow), 0 0 10px rgba(255,255,255,0.5); transform: scale(1.01); }
        }

        .container {
            max-width: 1250px;
            width: 100%;
            margin: 0 auto;
            padding: 15px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            flex: 1;
        }

        .left-panel { display: flex; flex-direction: column; gap: 20px; }

        .video-box {
            background: #000;
            border: 2px solid var(--panel-border);
            border-radius: 12px;
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
        }

        .video-box video {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: contain;
        }

        .control-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 15px;
            border-radius: 30px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            flex-wrap: wrap;
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .btn-action:hover {
            background: rgba(255, 0, 0, 0.2);
            border-color: var(--accent-red);
            color: #fff;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .btn-join {
            background: linear-gradient(135deg, #cc0000 0%, #7a0000 100%);
            border: none;
            color: #fff;
            padding: 0 25px;
            height: 42px;
            border-radius: 21px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .btn-join:hover {
            transform: scale(1.03);
            box-shadow: 0 0 25px var(--accent-glow);
            background: linear-gradient(135deg, #ff0000 0%, #990000 100%);
        }

        .btn-record {
            background: #222;
            border: 1px solid #ff3333;
            color: #ff3333;
            padding: 0 20px;
            height: 42px;
            border-radius: 21px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            display: none;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-record.recording {
            background: #ff3333;
            color: #fff;
            animation: blinkRec 1s ease-in-out infinite alternate;
        }

        @keyframes blinkRec {
            0% { box-shadow: 0 0 5px #ff3333; }
            100% { box-shadow: 0 0 20px #ff3333; }
        }

        .queue-box {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        .queue-box h3 {
            font-family: 'Orbitron', sans-serif;
            color: #fff;
            font-size: 1rem;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255,0,0,0.2);
            padding-bottom: 8px;
        }

        .song-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 220px;
            overflow-y: auto;
        }

        .song-item {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 12px 15px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
        }

        .song-item:hover, .song-item.active {
            border-color: var(--accent-red);
            background: rgba(255, 0, 0, 0.1);
        }

        .song-item.active {
            font-weight: bold;
            box-shadow: inset 0 0 10px rgba(255, 0, 0, 0.2);
        }

        .right-panel { display: flex; flex-direction: column; }

        .shoutbox {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 0, 0, 0.25);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 480px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 0 20px rgba(255,0,0,0.05);
        }

        .shoutbox-header {
            font-family: 'Orbitron', sans-serif;
            color: #ff3333;
            font-size: 0.95rem;
            letter-spacing: 2px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .chat-msg { font-size: 0.9rem; line-height: 1.4; word-break: break-word; }
        .chat-msg .admin { color: #ff3333; font-weight: bold; }
        .chat-msg .user { color: #dddddd; font-weight: bold; }
        .chat-input-group { display: flex; flex-direction: column; gap: 8px; }

        .input-field {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 10px 15px;
            color: #fff;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .input-field:focus { outline: none; border-color: var(--accent-red); box-shadow: 0 0 8px rgba(255,0,0,0.3); }

        .btn-send {
            background: #cc0000; border: none; color: #fff; padding: 10px; border-radius: 6px;
            font-family: 'Orbitron', sans-serif; font-weight: bold; cursor: pointer;
            letter-spacing: 1px; text-transform: uppercase; transition: background 0.2s;
        }
        .btn-send:hover { background: #ff0000; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.94);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.4s ease;
        }

        .modal-box {
            background: rgba(12, 12, 12, 0.96);
            border: 2px solid var(--accent-red);
            box-shadow: 0 0 35px rgba(255, 0, 0, 0.4);
            border-radius: 15px;
            padding: 35px;
            max-width: 420px;
            width: 90%;
            text-align: center;
        }

        .modal-box h2 {
            font-family: 'Cinzel Decorative', serif;
            color: #fff;
            font-size: 1.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .modal-box p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 25px; line-height: 1.4; }
        .role-btn-group { display: flex; gap: 15px; justify-content: center; margin-bottom: 10px; }

        .btn-role {
            flex: 1; padding: 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.03); color: #fff; font-family: 'Orbitron', sans-serif;
            font-weight: bold; cursor: pointer; transition: all 0.3s ease;
        }
        .btn-role:hover { background: rgba(255, 0, 0, 0.15); border-color: var(--accent-red); box-shadow: 0 0 15px rgba(255,0,0,0.3); }
        .admin-auth-area { display: none; flex-direction: column; gap: 10px; margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }

        footer {
            text-align: center; padding: 20px; font-size: 0.75rem; color: var(--text-muted); letter-spacing: 1px;
            text-transform: uppercase; border-top: 1px solid rgba(255,255,255,0.05); margin-top: 20px; font-family: 'Orbitron', sans-serif;
        }

        @media (max-width: 850px) {
            .container { grid-template-columns: 1fr; padding: 10px; gap: 15px; }
            header h1 { font-size: 1.6rem; }
            header p { font-size: 0.75rem; letter-spacing: 2px; }
            .shoutbox { min-height: 380px; }
            .control-bar { padding: 10px; gap: 8px; border-radius: 20px; }
            .btn-action { width: 38px; height: 38px; }
            .btn-join { padding: 0 15px; height: 38px; font-size: 0.75rem; }
            .btn-record { height: 38px; font-size: 0.75rem; padding: 0 12px; }
        }
    </style>
</head>
<body>

    <!-- POPUP MODAL PILIH PERAN -->
    <div class="modal-overlay" id="role-modal">
        <div class="modal-box">
            <h2>Pilih Peran Sesi</h2>
            <p>Silakan tentukan identitas masukmu untuk panggung virtual Deathbat Blitar Raya malam ini.</p>
            
            <div class="role-btn-group">
                <button class="btn-role" onclick="pilihAkses('member')">🤘 MEMBER</button>
                <button class="btn-role" onclick="tampilkanAuthAdmin()">💀 ADMIN / HOST</button>
            </div>

            <div class="admin-auth-area" id="auth-panel">
                <input type="password" id="admin-pass" class="input-field" placeholder="Masukkan Password Admin...">
                <button class="btn-send" style="padding: 12px;" onclick="validasiAdmin()">Verifikasi Masuk</button>
            </div>
        </div>
    </div>

    <header>
        <h1>Avenged Sevenfold Fan Karaoke</h1>
        <p>Live Virtual Session</p>
    </header>

    <div class="container">
        <!-- SEKTOR KIRI: PLAYER & LIST -->
        <div class="left-panel">
            <div class="video-box">
                <!-- HTML5 Offline Video Player -->
                <video id="offline-player" playsinline crossorigin="anonymous"></video>
            </div>

            <!-- Kontrol Sesi Live -->
            <div class="control-bar">
                <button class="btn-action" title="Lagu Sebelumnya" onclick="kontrolVideo('prev')"><i data-lucide="skip-back"></i></button>
                <button class="btn-action" id="play-pause-btn" title="Play" onclick="kontrolVideo('toggle')"><i data-lucide="play"></i></button>
                <button class="btn-action" title="Stop" onclick="kontrolVideo('stop')"><i data-lucide="square"></i></button>
                
                <button class="btn-join" onclick="joinSession()">Join The Live Session!</button>
                
                <!-- Tombol Record Baru -->
                <button class="btn-record" id="rec-btn" onclick="toggleMulaiRekam()">
                    <i data-lucide="mic" style="width: 16px;"></i> <span id="rec-text">Rekam Sesi</span>
                </button>
                
                <button class="btn-action" id="loop-btn" title="Ulangi Lagu Ini (Mati)" onclick="kontrolVideo('loop')"><i data-lucide="repeat"></i></button>
                <button class="btn-action" id="shuffle-btn" title="Mode Acak (Mati)" onclick="kontrolVideo('shuffle')"><i data-lucide="shuffle"></i></button>
                <button class="btn-action" title="Lagu Berikutnya" onclick="kontrolVideo('next')"><i data-lucide="skip-forward"></i></button>
            </div>

            <!-- Daftar Antrean Lagu -->
            <div class="queue-box">
                <h3>Live Queue / Playlist</h3>
                <ul class="song-list" id="playlist-container">
                    <!-- Ditangani via JS -->
                </ul>
            </div>
        </div>

        <!-- SEKTOR KANAN: MOSHPIT SHOUTBOX -->
        <div class="right-panel">
            <div class="shoutbox">
                <div class="shoutbox-header">
                    <i data-lucide="message-square" style="width: 18px; color: #ff3333;"></i> Moshpit Shoutbox
                </div>
                
                <div class="chat-area" id="chat-box">
                    <!-- Chat flow -->
                </div>

                <div class="chat-input-group">
                    <input type="text" id="chat-name" class="input-field" placeholder="Nama / Nickname...">
                    <input type="text" id="chat-text" class="input-field" placeholder="Ketik pesan moshpit...">
                    <button class="btn-send" onclick="kirimPesan()">Kirim</button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        © 2026 OFFICIAL A7X FANBASE INDO - DEVELOPED BY THE FALLEN_BLITAR
    </footer>

<!-- JavaScript SDK & Libraries -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<script>
    // 1. FIREBASE CONFIG
    const firebaseConfig = {
        apiKey: "AIzaSyBFlwXqdXmBFv3phfrzJJVua_1mmbqdMLI",
        authDomain: "a7x-karaoke.firebaseapp.com",
        databaseURL: "https://a7x-karaoke-default-rtdb.firebaseio.com", 
        projectId: "a7x-karaoke",
        storageBucket: "a7x-karaoke.firebasestorage.app",
        messagingSenderId: "597923188585",
        appId: "1:597923188585:web:f1d99cb92ebd67b127b7f8",
        measurementId: "G-R7KWEQF3ZK"
    };
    
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const roomRef = database.ref("live_room");
    const chatRef = database.ref("moshpit_chat");
    const peersRef = database.ref("online_peers");

    const a7xPlaylist = [
        { file: " https://cdn.discordapp.com/attachments/1498097093762486334/1514638030781288559/Avenged_Sevenfold_-_So_Far_Away_Karaoke_Version_-_Sing_King_720p_h264.mp4?ex=6a2c1817&is=6a2ac697&hm=376c5e734318c6201e8f46e803c109012baca556707fb64745168e2236e4abcc& ", title: "1. So Far Away - Avenged Sevenfold" },
        { file: " https://cdn.discordapp.com/attachments/1498097093762486334/1514639095706685651/Avenged_Sevenfold_-_Seize_the_Day_Karaoke_Instrumental_-_Core_Karaoke_720p_h264.mp4?ex=6a2c1915&is=6a2ac795&hm=04ad29264faeab913197c29b555c31644cfbb192de6b3fc9be25ff668f78048d& ", title: "2. Seize The Day - Avenged Sevenfold" },
        { file: " https://cdn.discordapp.com/attachments/1498097093762486334/1514639838475845632/AVENGED_SEVENFOLD_-_DEAR_GOD_-_KARAOKE_ORIGINAL_AUDIO_-_Tukang_Lembur_480p_h264.mp4?ex=6a2c19c6&is=6a2ac846&hm=93c6de34c284a87b2b5cc070c7f02a97e4c80883ff6dfd05f1d7510ba2e5d599& ", title: "3. Dear God - Avenged Sevenfold" },
        
    ];

    let currentSongIndex = 0;
    let isHost = false; 
    const videoPlayer = document.getElementById('offline-player');
    let isLooping = false;
    let isShuffled = false;
    let myPeer, localStream;

    let mediaRecorder;
    let recordedChunks = [];
    let isRecording = false;

    videoPlayer.src = a7xPlaylist[0].file;

    // 2. MODAL VALIDASI PERAN
    function tampilkanAuthAdmin() {
        document.getElementById('auth-panel').style.display = 'flex';
        document.getElementById('admin-pass').focus();
    }

    function validasiAdmin() {
        const pass = document.getElementById('admin-pass').value;
        if (pass === 'a7x2026') {
            isHost = true;
            document.getElementById('chat-name').value = "Admin";
            document.getElementById('chat-name').disabled = true;
            pilihAkses('admin');
        } else {
            alert("Sandi Admin Salah!");
        }
    }

    function pilihAkses(peran) {
        document.getElementById('role-modal').style.opacity = '0';
        setTimeout(() => { document.getElementById('role-modal').style.display = 'none'; }, 400);
        lucide.createIcons();
        loadPlaylist();
        initFirebaseListeners();
    }

    document.getElementById('admin-pass').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') validasiAdmin();
    });

    // 3. RENDER PLAYLIST PANEL
    function loadPlaylist() {
        const playlistContainer = document.getElementById('playlist-container');
        playlistContainer.innerHTML = '';
        a7xPlaylist.forEach((song, idx) => {
            const li = document.createElement('li');
            li.className = `song-item ${idx === currentSongIndex ? 'active' : ''}`;
            li.innerHTML = `<i data-lucide="music-2" style="width:16px; color: #ff3333;"></i> <span>${song.title}</span>`;
            
            li.onclick = () => {
                if (!isHost) {
                    alert("Kunci Otoritas! Hanya Admin yang berhak memindahkan lagu.");
                    return;
                }
                currentSongIndex = idx;
                perbaruiKondisiRoom(a7xPlaylist[idx].file, 'play');
            };
            playlistContainer.appendChild(li);
        });
        lucide.createIcons();
    }

    // 4. MANAGEMENT PERINTAH SINKRONISASI
    function perbaruiKondisiRoom(songFile, statusAksi) {
        if (!isHost) return;
        roomRef.set({
            currentSongFile: songFile,
            action: statusAksi,
            currentTime: videoPlayer.currentTime,
            timestamp: Date.now()
        });
    }

    function initFirebaseListeners() {
        roomRef.on("value", (snapshot) => {
            const data = snapshot.val();
            if (data && videoPlayer) {
                const targetIdx = a7xPlaylist.findIndex(s => s.file === data.currentSongFile);
                if (targetIdx !== -1) currentSongIndex = targetIdx;

                const currentSrc = videoPlayer.getAttribute('src') || "";
                if (!currentSrc.includes(data.currentSongFile)) {
                    videoPlayer.src = data.currentSongFile;
                }

                if (data.action === 'play') {
                    videoPlayer.play().catch(() => {});
                    let selisih = Math.abs(videoPlayer.currentTime - data.currentTime);
                    if (selisih > 1.5) { videoPlayer.currentTime = data.currentTime; }
                } else if (data.action === 'pause') {
                    videoPlayer.pause();
                } else if (data.action === 'stop') {
                    videoPlayer.pause();
                    videoPlayer.currentTime = 0;
                }

                document.querySelectorAll('.song-item').forEach((item, idx) => {
                    if (idx === currentSongIndex) { item.classList.add('active'); } else { item.classList.remove('active'); }
                });
            }
        });

        if (isHost) {
            setInterval(() => {
                if (!videoPlayer.paused) {
                    roomRef.update({ currentTime: videoPlayer.currentTime, timestamp: Date.now() });
                }
            }, 2000);
        }

        chatRef.limitToLast(30).on("child_added", (snapshot) => {
            const chatBox = document.getElementById('chat-box');
            const data = snapshot.val();
            const msgDiv = document.createElement('div');
            msgDiv.className = 'chat-msg';
            const roleClass = data.name.toLowerCase() === 'admin' ? 'admin' : 'user';
            
            msgDiv.innerHTML = `<span class="${roleClass}">${data.name}:</span> ${data.text}`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    }

    videoPlayer.onplay = () => { document.getElementById('play-pause-btn').innerHTML = `<i data-lucide="pause"></i>`; lucide.createIcons(); };
    videoPlayer.onpause = () => { document.getElementById('play-pause-btn').innerHTML = `<i data-lucide="play"></i>`; lucide.createIcons(); };

    videoPlayer.onended = () => {
        if (isHost) {
            if (isLooping) { perbaruiKondisiRoom(a7xPlaylist[currentSongIndex].file, 'play'); } else { kontrolVideo('next'); }
        }
    };

    // 5. IMPLEMENTASI TOMBOL KONTROL
    function kontrolVideo(aksi) {
        if (!isHost) { alert("Akses Terkunci! Hanya Admin yang memegang kendali tombol."); return; }
        if (aksi === 'toggle') {
            if (videoPlayer.paused) { perbaruiKondisiRoom(a7xPlaylist[currentSongIndex].file, 'play'); } else { perbaruiKondisiRoom(a7xPlaylist[currentSongIndex].file, 'pause'); }
        } else if (aksi === 'stop') {
            perbaruiKondisiRoom(a7xPlaylist[currentSongIndex].file, 'stop');
        } else if (aksi === 'next') {
            currentSongIndex = isShuffled ? Math.floor(Math.random() * a7xPlaylist.length) : (currentSongIndex + 1) % a7xPlaylist.length;
            perbaruiKondisiRoom(a7xPlaylist[currentSongIndex].file, 'play');
        } else if (aksi === 'prev') {
            currentSongIndex = (currentSongIndex - 1 + a7xPlaylist.length) % a7xPlaylist.length;
            perbaruiKondisiRoom(a7xPlaylist[currentSongIndex].file, 'play');
        } else if (aksi === 'loop') {
            isLooping = !isLooping; styleBtn('loop-btn', isLooping);
        } else if (aksi === 'shuffle') {
            isShuffled = !isShuffled; styleBtn('shuffle-btn', isShuffled);
        }
    }

    function styleBtn(id, active) {
        const btn = document.getElementById(id);
        btn.style.borderColor = active ? 'var(--accent-red)' : 'rgba(255,255,255,0.1)';
        btn.style.boxShadow = active ? '0 0 10px var(--accent-glow)' : 'none';
    }

    // 6. MOSHPIT SHOUTBOX
    function kirimPesan() {
        const nameInput = document.getElementById('chat-name');
        const textInput = document.getElementById('chat-text');
        if(nameInput.value.trim() !== "" && textInput.value.trim() !== "") {
            chatRef.push({ name: nameInput.value, text: textInput.value, timestamp: Date.now() });
            textInput.value = "";
        }
    }

    document.getElementById('chat-text').addEventListener('keypress', function (e) { if (e.key === 'Enter') kirimPesan(); });

    // 7. SINKRONISASI LIVE VOICE PEERJS
    function joinSession() {
        const btnJoin = document.querySelector('.btn-join');
        btnJoin.innerText = "MENGHUBUNGKAN...";
        btnJoin.disabled = true;

        navigator.mediaDevices.getUserMedia({ audio: true, video: false })
        .then((stream) => {
            localStream = stream;
            myPeer = new Peer();

            myPeer.on('open', (userId) => {
                const myPeerRef = peersRef.push({ peerId: userId, timestamp: Date.now() });
                myPeerRef.onDisconnect().remove();
                btnJoin.innerText = "LIVE VOICE CONNECTED 🔴";
                btnJoin.style.background = "#00cc44";
                btnJoin.style.boxShadow = "0 0 15px #00cc44";

                document.getElementById('rec-btn').style.display = 'flex';
                lucide.createIcons();
            });

            myPeer.on('call', (call) => {
                call.answer(localStream);
                call.on('stream', (remoteStream) => { playAudioStream(remoteStream); });
            });

            peersRef.on('child_added', (snapshot) => {
                const data = snapshot.val();
                if (data && data.peerId !== myPeer.id) {
                    const call = myPeer.call(data.peerId, localStream);
                    call.on('stream', (remoteStream) => { playAudioStream(remoteStream); });
                }
            });
        })
        .catch((err) => {
            alert("Gagal mengaktifkan voice chat: " + err);
            btnJoin.innerText = "JOIN THE LIVE SESSION!";
            btnJoin.disabled = false;
        });
    }

    function playAudioStream(stream) {
        const existingAudios = Array.from(document.querySelectorAll('audio'));
        const alreadyPlaying = existingAudios.some(audio => audio.srcObject && audio.srcObject.id === stream.id);
        if (!alreadyPlaying) {
            const audio = document.createElement('audio');
            audio.srcObject = stream;
            audio.autoplay = true;
            document.body.appendChild(audio);
        }
    }

    // 8. LOGIKA PEREKAM AUDIO INTERNAL
    function toggleMulaiRekam() {
        const recBtn = document.getElementById('rec-btn');
        const recText = document.getElementById('rec-text');

        if (!isRecording) {
            recordedChunks = [];
            
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const dest = audioContext.createMediaStreamDestination();

                if (localStream) {
                    const micSource = audioContext.createMediaStreamSource(localStream);
                    micSource.connect(dest);
                }

                if (videoPlayer) {
                    const videoSource = audioContext.createMediaElementSource(videoPlayer);
                    videoSource.connect(audioContext.destination); 
                    videoSource.connect(dest); 
                }

                mediaRecorder = new MediaRecorder(dest.stream);
                
                mediaRecorder.ondataavailable = function(e) {
                    if (e.data.size > 0) {
                        recordedChunks.push(e.data);
                    }
                };

                mediaRecorder.onstop = function() {
                    const blob = new Blob(recordedChunks, { type: 'audio/webm' });
                    const url = URL.createObjectURL(blob);
                    
                    const downloadLink = document.createElement('a');
                    downloadLink.href = url;
                    downloadLink.download = `Setlist_Karaoke_A7X_Blitar_${Date.now()}.webm`;
                    document.body.appendChild(downloadLink);
                    downloadLink.click(); 
                    document.body.removeChild(downloadLink);
                    
                    alert("Rekaman Berhasil Disimpan! File otomatis terunduh di perangkatmu.");
                };

                mediaRecorder.start();
                isRecording = true;
                recBtn.classList.add('recording');
                recText.innerText = "Berhenti Rekam";
                console.log("Proses perekaman panggung dimulai...");
            } catch (err) {
                alert("Browser menolak sistem jahit rekaman: " + err);
            }

        } else {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            isRecording = false;
            recBtn.classList.remove('recording');
            recText.innerText = "Rekam Sesi";
            console.log("Proses perekaman dihentikan.");
        }
    }
</script>
